{
  "name": "Build VST3",
  "on": [
    "push",
    "workflow_dispatch"
  ],
  "jobs": {
    "windows": {
      "runs-on": "windows-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Configure Minimal Transformer",
          "run": "cmake -S MinimalTransformer -B build -DCMAKE_BUILD_TYPE=Release"
        },
        {
          "name": "Build Minimal Transformer",
          "run": "cmake --build build --config Release --parallel"
        },
        {
          "name": "Configure PokeChord",
          "run": "cmake -S PokeChord -B build-poke -DCMAKE_BUILD_TYPE=Release"
        },
        {
          "name": "Build PokeChord",
          "run": "cmake --build build-poke --config Release --parallel"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "MinimalTransformer-Windows-VST3",
            "path": "build/MinimalTransformer_artefacts/Release/VST3"
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "PokeChord-Windows-VST3",
            "path": "build-poke/PokeChord_artefacts/Release/VST3"
          }
        }
      ]
    },
    "macos": {
      "runs-on": "macos-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Configure Minimal Transformer",
          "run": "cmake -S MinimalTransformer -B build -G Xcode '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
        },
        {
          "name": "Build Minimal Transformer",
          "run": "cmake --build build --config Release --parallel"
        },
        {
          "name": "Sign Minimal Transformer",
          "run": "codesign --force --deep -s - build/MinimalTransformer_artefacts/Release/VST3/MinimalTransformer.vst3"
        },
        {
          "name": "Configure PokeChord",
          "run": "cmake -S PokeChord -B build-poke -G Xcode '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
        },
        {
          "name": "Build PokeChord",
          "run": "cmake --build build-poke --config Release --parallel"
        },
        {
          "name": "Sign PokeChord",
          "run": "codesign --force --deep -s - build-poke/PokeChord_artefacts/Release/VST3/PokeChord.vst3"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "MinimalTransformer-macOS-VST3",
            "path": "build/MinimalTransformer_artefacts/Release/VST3"
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "PokeChord-macOS-VST3",
            "path": "build-poke/PokeChord_artefacts/Release/VST3"
          }
        }
      ]
    }
  }
}